<?xml version="1.0" encoding="UTF-8"?>
<!--
  Samruddhi Shinde profile banner | 1400 x 420
  Customise: palette in <defs>, copy in CONTENT, timing through each dur value.
  Pure SVG + SMIL only: no scripts, external fonts, stylesheets, or dependencies.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Samruddhi Shinde - Full Stack Developer</title>
  <desc id="desc">A dark developer banner with a slow animated aurora wave and rotating orbital accent.</desc>

  <defs>
    <!-- COLOUR SYSTEM -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050817"/>
      <stop offset="0.55" stop-color="#0a1025"/>
      <stop offset="1" stop-color="#12091f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"><animate attributeName="stop-color" values="#6d28d9;#4f9dff;#6d28d9" dur="15s" repeatCount="indefinite"/></stop>
      <stop offset="0.48" stop-color="#7c4dff"><animate attributeName="stop-color" values="#7c4dff;#00d4ff;#7c4dff" dur="15s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#00c8d8"><animate attributeName="stop-color" values="#00c8d8;#7c4dff;#00c8d8" dur="15s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="orbital" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.55" stop-color="#4f9dff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.36"/>
      <stop offset="0.52" stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#8bb9ff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="dot-glow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BASE LAYER -->
  <rect width="1400" height="420" fill="url(#background)"/>
  <rect width="1400" height="420" fill="url(#grid)"/>
  <circle cx="700" cy="178" r="270" fill="url(#halo)"><animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/></circle>

  <!-- ATMOSPHERIC LIGHT -->
  <g filter="url(#soft-glow)" opacity="0.4">
    <path d="M-80 50L430 -40H620L-20 160Z" fill="#4f9dff"><animate attributeName="opacity" values="0.18;0.48;0.18" dur="12s" repeatCount="indefinite"/></path>
    <path d="M930 425L1200 -20H1430L1100 425Z" fill="#7c4dff"><animate attributeName="opacity" values="0.46;0.14;0.46" dur="14s" repeatCount="indefinite"/></path>
  </g>

  <!-- SIGNATURE AURORA WAVE: smooth, slow, and deliberately low-contrast. -->
  <g filter="url(#soft-glow)" opacity="0.52">
    <path fill="url(#wave)" d="M-30 305 C170 258 285 350 510 306 S820 248 1040 302 S1260 355 1430 292 L1430 430 L-30 430Z">
      <animate attributeName="d" values="M-30 305 C170 258 285 350 510 306 S820 248 1040 302 S1260 355 1430 292 L1430 430 L-30 430Z;M-30 292 C165 352 310 250 520 300 S825 355 1048 288 S1260 244 1430 310 L1430 430 L-30 430Z;M-30 305 C170 258 285 350 510 306 S820 248 1040 302 S1260 355 1430 292 L1430 430 L-30 430Z" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>
  <path fill="url(#wave)" opacity="0.74" d="M-30 324 C170 278 310 357 515 323 S824 270 1048 320 S1260 366 1430 310 L1430 420 L-30 420Z">
    <animate attributeName="d" values="M-30 324 C170 278 310 357 515 323 S824 270 1048 320 S1260 366 1430 310 L1430 420 L-30 420Z;M-30 310 C170 360 310 279 515 316 S824 360 1048 305 S1260 268 1430 330 L1430 420 L-30 420Z;M-30 324 C170 278 310 357 515 323 S824 270 1048 320 S1260 366 1430 310 L1430 420 L-30 420Z" dur="18s" repeatCount="indefinite"/>
  </path>

  <!-- ORBITAL ACCENT: a subtle moving counterpart to the wave. -->
  <g transform="translate(700 157)" fill="none">
    <circle r="112" stroke="#7c4dff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 12"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="32s" repeatCount="indefinite"/></circle>
    <ellipse rx="138" ry="53" stroke="url(#orbital)" stroke-opacity="0.62" stroke-width="1.5" stroke-dasharray="136 44"><animateTransform attributeName="transform" type="rotate" values="-18;-378" dur="26s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="61" ry="130" stroke="#00d4ff" stroke-opacity="0.26" stroke-width="1" stroke-dasharray="60 28"><animateTransform attributeName="transform" type="rotate" values="36;396" dur="21s" repeatCount="indefinite"/></ellipse>
    <circle r="76" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="137" cy="0" r="4" fill="#67e8f9" filter="url(#dot-glow)"><animateTransform attributeName="transform" type="rotate" values="-18 0 0;-378 0 0" dur="26s" repeatCount="indefinite"/></circle>
  </g>

  <!-- FLOATING PARTICLES -->
  <g filter="url(#dot-glow)">
    <circle cx="230" cy="142" r="2.5" fill="#67e8f9"><animate attributeName="opacity" values="0.15;1;0.15" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="285" r="2" fill="#a78bfa"><animate attributeName="opacity" values="1;0.18;1" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="128" r="2.4" fill="#67e8f9"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1195" cy="253" r="2" fill="#c4b5fd"><animate attributeName="opacity" values="1;0.16;1" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- CONTENT -->
  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="700" y="150" fill="#f8fafc" font-size="62" font-weight="700" letter-spacing="-1.6">Samruddhi Shinde</text>
    <text x="700" y="193" fill="#cbd5e1" font-size="21" font-weight="500" letter-spacing="0.2">Information Technology Student</text>
    <text x="700" y="225" fill="#67e8f9" font-size="16" font-weight="700" letter-spacing="2.4">FULL STACK DEVELOPER  &#8226;  AI / ML ENTHUSIAST</text>
    <g transform="translate(700 258)">
      <path d="M-160 0H-15M15 0H160" stroke="#8bb9ff" stroke-opacity="0.5" stroke-width="1"/>
      <circle r="3.5" fill="#67e8f9" filter="url(#dot-glow)"><animate attributeName="r" values="2.5;5.5;2.5" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
