<svg width="1400" height="420"
viewBox="0 0 1400 420"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#050816"/>
<stop offset="100%" stop-color="#090B17"/>
</linearGradient>

<linearGradient id="aurora"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%">
<animate
attributeName="stop-color"
values="#4F9DFF;#7C4DFF;#00D4FF;#4F9DFF"
dur="8s"
repeatCount="indefinite"/>
</stop>

<stop offset="50%">
<animate
attributeName="stop-color"
values="#6A5CFF;#00D4FF;#4F9DFF;#6A5CFF"
dur="8s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%">
<animate
attributeName="stop-color"
values="#00CFFF;#4F9DFF;#7C4DFF;#00CFFF"
dur="8s"
repeatCount="indefinite"/>
</stop>

</linearGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="65"/>
</filter>

</defs>

<rect
width="1400"
height="420"
fill="url(#bg)"/>

<ellipse
cx="250"
cy="120"
rx="260"
ry="70"
fill="url(#aurora)"
filter="url(#blur)"
opacity=".55">

<animate
attributeName="cx"
values="200;450;250"
dur="12s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="950"
cy="280"
rx="320"
ry="90"
fill="url(#aurora)"
filter="url(#blur)"
opacity=".45">

<animate
attributeName="cx"
values="1000;800;950"
dur="15s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="700"
cy="80"
rx="180"
ry="50"
fill="url(#aurora)"
filter="url(#blur)"
opacity=".25">

<animate
attributeName="cy"
values="70;120;70"
dur="10s"
repeatCount="indefinite"/>

</ellipse>

</svg>