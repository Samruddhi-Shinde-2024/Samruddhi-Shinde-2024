<svg width="1400" height="420"
viewBox="0 0 1400 420"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#050816"/>
<stop offset="100%" stop-color="#090B17"/>
</linearGradient>

<linearGradient id="aurora"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%">
<animate
attributeName="stop-color"
values="#4F9DFF;#7C4DFF;#00D4FF;#4F9DFF"
dur="8s"
repeatCount="indefinite"/>
</stop>

<stop offset="50%">
<animate
attributeName="stop-color"
values="#6A5CFF;#00D4FF;#4F9DFF;#6A5CFF"
dur="8s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%">
<animate
attributeName="stop-color"
values="#00CFFF;#4F9DFF;#7C4DFF;#00CFFF"
dur="8s"
repeatCount="indefinite"/>
</stop>

</linearGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="65"/>
</filter>

</defs>

<rect
width="1400"
height="420"
fill="url(#bg)"/>

<ellipse
cx="250"
cy="120"
rx="260"
ry="70"
fill="url(#aurora)"
filter="url(#blur)"
opacity=".55">

<animate
attributeName="cx"
values="200;450;250"
dur="12s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="950"
cy="280"
rx="320"
ry="90"
fill="url(#aurora)"
filter="url(#blur)"
opacity=".45">

<animate
attributeName="cx"
values="1000;800;950"
dur="15s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="700"
cy="80"
rx="180"
ry="50"
fill="url(#aurora)"
filter="url(#blur)"
opacity=".25">

<animate
attributeName="cy"
values="70;120;70"
dur="10s"
repeatCount="indefinite"/>

</ellipse>

<!-- GRID -->

<g opacity=".08">

<path
d="M0 60H1400
M0 120H1400
M0 180H1400
M0 240H1400
M0 300H1400
M0 360H1400"

stroke="#4F9DFF"
stroke-width="1"/>

<path
d="M150 0V420
M300 0V420
M450 0V420
M600 0V420
M750 0V420
M900 0V420
M1050 0V420
M1200 0V420"

stroke="#4F9DFF"
stroke-width="1"/>

</g>

<!-- TITLE -->

<text
x="700"
y="150"
fill="white"
font-size="64"
font-weight="700"
font-family="Segoe UI"
text-anchor="middle">

Samruddhi

<tspan fill="#4F9DFF">
Shinde
</tspan>

</text>

<!-- SUBTITLE -->

<text
x="700"
y="205"
fill="#D8D8D8"
font-size="28"
font-family="Segoe UI"
text-anchor="middle">

Information Technology Student

</text>

<!-- ROLE -->

<text
x="700"
y="245"
fill="#4F9DFF"
font-size="24"
font-family="Segoe UI"
text-anchor="middle">

Full Stack Developer • AI/ML Enthusiast

</text>

<!-- LINE -->

<line
x1="450"
x2="950"
y1="285"
y2="285"

stroke="#4F9DFF"

stroke-width="2"

opacity=".35"/>

<!-- GLOWING DOT -->

<circle
cx="700"
cy="285"
r="5"
fill="#4F9DFF">

<animate

attributeName="r"

values="4;8;4"

dur="2s"

repeatCount="indefinite"/>

</circle>

<!-- FLOATING ICONS -->

<text
x="260"
y="120"
font-size="28">

💻

<animateTransform

attributeName="transform"

type="translate"

values="0 0;0 -12;0 0"

dur="5s"

repeatCount="indefinite"/>

</text>

<text
x="1110"
y="120"
font-size="28">

⚙️

<animateTransform

attributeName="transform"

type="translate"

values="0 0;0 10;0 0"

dur="6s"

repeatCount="indefinite"/>

</text>

<text
x="270"
y="310"
font-size="28">

🤖

<animateTransform

attributeName="transform"

type="translate"

values="0 0;0 -10;0 0"

dur="7s"

repeatCount="indefinite"/>

</text>

<text
x="1120"
y="310"
font-size="28">

☁️

<animateTransform

attributeName="transform"

type="translate"

values="0 0;0 12;0 0"

dur="5s"

repeatCount="indefinite"/>

</text>

</svg>