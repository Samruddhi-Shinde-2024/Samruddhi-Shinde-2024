<svg width="1400" height="420" viewBox="0 0 1400 420"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#050816"/>
<stop offset="100%" stop-color="#090B17"/>
</linearGradient>

<linearGradient id="aurora" x1="0%" x2="100%">
<stop offset="0%" stop-color="#4F9DFF">
<animate attributeName="stop-color"
values="#4F9DFF;#7C4DFF;#4F9DFF"
dur="13s"
repeatCount="indefinite"/>
</stop>

<stop offset="50%" stop-color="#6A5CFF">
<animate attributeName="stop-color"
values="#6A5CFF;#00D4FF;#6A5CFF"
dur="15s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#00CFFF">
<animate attributeName="stop-color"
values="#00CFFF;#4F9DFF;#00CFFF"
dur="13s"
repeatCount="indefinite"/>
</stop>

</linearGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="45"/>
</filter>

</defs>

<rect width="1400" height="420" fill="url(#bg)"/>

<ellipse
cx="700"
cy="120"
rx="520"
ry="85"
fill="url(#aurora)"
opacity="0.85"
filter="url(#blur)">

<animateTransform
attributeName="transform"
type="translate"
values="-80 0;80 0;-80 0"
dur="17s"
repeatCount="indefinite"/>

</ellipse>

<ellipse
cx="550"
cy="180"
rx="380"
ry="60"
fill="#5B7FFF"
opacity="0.30"
filter="url(#blur)">

<animateTransform
attributeName="transform"
type="translate"
values="70 0;-70 0;70 0"
dur="20s"
repeatCount="indefinite"/>

</ellipse>

<path
fill="none"
stroke="url(#aurora)"
stroke-width="5"
stroke-linecap="round"
opacity="0.9"

d="M0 300
Q250 250
500 300
T1000 300
T1400 300">

<animate
attributeName="d"

dur="10s"

repeatCount="indefinite"

values="
M0 300 Q250 250 500 300 T1000 300 T1400 300;

M0 290 Q250 340 500 280 T1000 330 T1400 280;

M0 300 Q250 250 500 300 T1000 300 T1400 300"/>

</path>

<text
x="700"
y="165"
fill="white"
font-size="56"
font-family="Segoe UI"
font-weight="700"
text-anchor="middle">

Samruddhi Shinde

</text>

<text
x="700"
y="210"
fill="#78A6FF"
font-size="24"
font-family="Segoe UI"
text-anchor="middle">

Full Stack Developer • AI/ML Enthusiast

</text>

<text
x="700"
y="245"
fill="#C7D4FF"
font-size="18"
font-family="Segoe UI"
text-anchor="middle">

Building Scalable Software & Intelligent Solutions

</text>

</svg>