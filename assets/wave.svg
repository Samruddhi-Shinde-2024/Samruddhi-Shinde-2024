<svg width="1200" height="120" viewBox="0 0 1200 120"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5">
        <animate attributeName="stop-color"
                 values="#4F46E5;#9333EA;#06B6D4;#4F46E5"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color"
                 values="#06B6D4;#4F46E5;#9333EA;#06B6D4"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>

    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <path
      fill="none"
      stroke="url(#grad)"
      stroke-width="5"
      filter="url(#glow)"
      d="M0 60
         Q150 20 300 60
         T600 60
         T900 60
         T1200 60">

      <animate
          attributeName="d"
          dur="5s"
          repeatCount="indefinite"
          values="
          M0 60 Q150 20 300 60 T600 60 T900 60 T1200 60;
          M0 60 Q150 100 300 60 T600 60 T900 60 T1200 60;
          M0 60 Q150 20 300 60 T600 60 T900 60 T1200 60"/>

  </path>

</svg>